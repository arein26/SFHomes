<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SF Home Domain Scout</title>
    <link rel="stylesheet" href="css/style.css?v=11">
</head>
<body>
    <header>
        <div class="header-content">
            <h1>SF Home Domain Scout</h1>
            <p class="subtitle">Domain search for 2,200+ SF single-family homes — N of Market, E of Arguello, W of Van Ness</p>
        </div>
    </header>

    <main>
        <section id="controls-section">
            <div class="controls-row">
                <button id="search-btn" class="btn btn-primary">
                    <span class="btn-icon">&#x1F50D;</span> Search All Domains
                </button>

                <div class="control-info">
                    <label>
                        <input type="checkbox" id="auto-check-domains" checked>
                        Auto-check domains
                    </label>
                    <label>
                        Max addresses:
                        <select id="max-results">
                            <option value="100">100</option>
                            <option value="500">500</option>
                            <option value="1000">1000</option>
                            <option value="2500" selected>All</option>
                        </select>
                    </label>
                </div>
            </div>
        </section>

        <section id="status-section" hidden>
            <div id="status-bar">
                <span id="status-text"></span>
                <div id="progress-container">
                    <div id="progress-bar">
                        <div id="progress-fill"></div>
                    </div>
                    <span id="progress-text"></span>
                </div>
            </div>
        </section>

        <section id="results-section" hidden>
            <div id="results-header">
                <h2>Results <span id="results-count"></span></h2>
                <div class="results-actions">
                    <button id="check-all-btn" class="btn btn-small">Check All Domains</button>
                    <button id="show-all-btn" class="btn btn-small btn-secondary" hidden>Show All Addresses</button>
                    <button id="export-btn" class="btn btn-small btn-secondary">Export CSV</button>
                </div>
            </div>
            <div id="results-legend">
                <span class="legend-item"><span class="dot dot-active"></span> Domain Active</span>
                <span class="legend-item"><span class="dot dot-registered"></span> Registered (no DNS)</span>
                <span class="legend-item"><span class="dot dot-available"></span> Not Registered</span>
                <span class="legend-item"><span class="dot dot-unchecked"></span> Unchecked</span>
            </div>
            <div id="results-list"></div>
        </section>
    </main>

    <footer>
        <p>Property data from ZenList. Domain checks via RDAP &amp; DNS-over-HTTPS. For informational purposes only.</p>
    </footer>

    <script src="js/config.js?v=11"></script>
    <script src="js/sfdata.js?v=11"></script>
    <script src="js/domains.js?v=11"></script>
    <script src="js/ui.js?v=11"></script>
    <script src="js/app.js?v=11"></script>
</body>
</html>
